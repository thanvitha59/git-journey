<!DOCTYPE html>
<html>
<head>
    <title>My Profile Card</title>

    <style>
        body {
            background-color: lightblue;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .card {
            background-color: white;
            width: 350px;
            margin: 50px auto;
            padding: 25px;
            border: 2px solid black;
            border-radius: 15px;
        }

        h1 {
            color: darkblue;
        }

        p {
            color: gray;
            font-size: 18px;
        }

        .skill {
            color: green;
            font-weight: bold;
        }

        button {
            background-color: darkblue;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>Thanvitha</h1>

        <p>HTML & CSS Learner</p>

        <p class="skill">Learning Web Development 🚀</p>

        <button>My Profile</button>

    </div>

</body>
</html>
