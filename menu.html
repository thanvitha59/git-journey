<!DOCTYPE html>
<html>
<head>
    <title>Restaurant Menu</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fff8e7;
        }

        h1 {
            text-align: center;
            color: darkred;
        }

        .menu {
            width: 500px;
            margin: 30px auto;
            padding: 25px;
            background-color: white;
            border: 2px solid darkred;
            border-radius: 15px;
        }

        h2 {
            color: darkred;
            border-bottom: 2px solid darkred;
            padding-bottom: 5px;
        }

        li {
            margin: 10px;
            font-size: 18px;
        }

        .price {
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="menu">

        <h1>🍽️ My Restaurant</h1>

        <h2>Main Dishes</h2>

        <ul>
            <li>Biryani <span class="price">₹180</span></li>
            <li>Fried Rice <span class="price">₹140</span></li>
            <li>Pizza <span class="price">₹220</span></li>
            <li>Paneer Curry <span class="price">₹160</span></li>
        </ul>

        <h2>Drinks</h2>

        <ul>
            <li>Lime Soda <span class="price">₹60</span></li>
            <li>Fresh Juice <span class="price">₹80</span></li>
        </ul>

    </div>

</body>
</html>
